<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside id="sidebar">
  <header>
    <h1>观看会话</h1>
    <button id="refresh" class="ghost" title="刷新列表">↻</button>
  </header>
  <ul id="session-list"></ul>
</aside>

<main id="main">
  <section id="placeholder">
    <p>从左边选一个观看会话</p>
    <p class="hint">每次「开始采集」都会新建一份，一集一份。</p>
  </section>

  <section id="detail" hidden>
    <header id="detail-header">
      <div class="titles">
        <h2 id="session-name"></h2>
        <p id="session-meta"></p>
      </div>
      <div class="actions">
        <input id="filter" type="search" placeholder="筛句子…" autocomplete="off">
        <button id="export-md">导出 Markdown</button>
        <button id="export-txt" class="ghost">纯文本</button>
        <button id="reveal" class="ghost" title="在 Finder 中显示导出的文件">Finder</button>
      </div>
    </header>
    <ol id="entries"></ol>
    <p id="no-match" class="hint" hidden>没有匹配的句子。</p>
  </section>
</main>

<div id="menu" hidden></div>
<div id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
